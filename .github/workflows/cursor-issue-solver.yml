name: "🔧 AI AGENT"

run-name: "${{ github.event_name == 'issues' && format('🔧 AI AGENT — {0}', github.event.issue.number) || '🔧 AI AGENT' }}"

# Automatic runs: only when an issue (not a pull request) is labeled `solve`.
# GitHub still fires `issues.labeled` if a PR is labeled, so the job also
# checks that the payload is not a pull request.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      max_issues:
        description: "How many open `solve`-labeled issues to process"
        required: false
        default: "1"
      issue_number:
        description: "Optional single issue number to process"
        required: false
        default: ""
      dry_run:
        description: "If true, do not call Cursor API"
        required: false
        default: "true"
      base_ref:
        description: "Base branch for generated fix branches"
        required: false
        default: ""
      model:
        description: "Cursor model ID"
        required: false
        default: "composer-2.5"

permissions:
  contents: read
  issues: write

jobs:
  launch-issue-agents:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'solve' &&
       github.event.issue.pull_request == null)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ai-agent-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve parameters
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MAX_ISSUES="${{ inputs.max_issues }}"
            DRY_RUN="${{ inputs.dry_run }}"
            MODEL="${{ inputs.model }}"
            BASE_REF="${{ inputs.base_ref }}"
            ISSUE_NUMBER="${{ inputs.issue_number }}"
          else
            MAX_ISSUES="1"
            DRY_RUN="false"
            MODEL="composer-2.5"
            BASE_REF=""
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi

          if [ -z "$BASE_REF" ]; then
            BASE_REF="${{ github.event.repository.default_branch }}"
          fi

          echo "max_issues=$MAX_ISSUES" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Launch Cursor agent for solve-labeled issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ steps.params.outputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
          fi
          if [ -n "${{ steps.params.outputs.issue_number }}" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --issue-number ${{ steps.params.outputs.issue_number }}"
          fi

          python scripts/run_issue_solver_agents.py \
            --repo "$REPO" \
            --repo-url "https://github.com/$REPO" \
            --base-ref "${{ steps.params.outputs.base_ref }}" \
            --max-issues "${{ steps.params.outputs.max_issues }}" \
            --model "${{ steps.params.outputs.model }}" \
            --label solve \
            $EXTRA_FLAGS
