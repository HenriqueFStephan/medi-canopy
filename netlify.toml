# Netlify — https://app.netlify.com
# Same-origin /api/v1 is proxied to the Render FastAPI service.

[build]
  base = "frontend"
  command = "npm ci && npm run build:ci"
  publish = "dist/cannahub"

[build.environment]
  NODE_VERSION = "18"
  NG_APP_API_URL = "/api/v1"

# Proxy API calls to Render so the browser stays same-origin (no CORS).
# Must sit above the Angular SPA catch-all.
[[redirects]]
  from = "/api/v1/*"
  to = "https://cannahub-api.onrender.com/api/v1/:splat"
  status = 200
  force = true

# Static design preview — served as-is, do NOT redirect to Angular
[[redirects]]
  from = "/assets/page_url/*"
  to = "/assets/page_url/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/assets/color_identity/*"
  to = "/assets/color_identity/:splat"
  status = 200
  force = false

# Angular SPA catch-all (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
