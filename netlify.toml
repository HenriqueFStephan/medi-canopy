# Netlify — https://app.netlify.com
# NG_APP_API_URL is baked here so production builds hit the Render API
# even if the dashboard env var was never set.

[build]
  base = "frontend"
  command = "npm ci && npm run build:ci"
  publish = "dist/cannahub"

[build.environment]
  NODE_VERSION = "18"
  NG_APP_API_URL = "https://cannahub-api.onrender.com/api/v1"

# Static design preview — served as-is, do NOT redirect to Angular
[[redirects]]
  from = "/assets/page_url/*"
  to = "/assets/page_url/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/assets/color_identity/*"
  to = "/assets/color_identity/:splat"
  status = 200
  force = false

# Angular SPA catch-all (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
