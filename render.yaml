# Render Blueprint — https://dashboard.render.com
# Option A: New + → Blueprint → select medi-canopy repo
# Option B: New + → Web Service → Root Directory: backend, Runtime: Python 3
# After deploy: set FRONTEND_URL to your Netlify URL, then redeploy.

services:
  - type: web
    name: cannahub-api
    runtime: python
    repo: https://github.com/HenriqueFStephan/medi-canopy
    branch: main
    rootDir: backend
    plan: free
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: placeholder
      - key: FRONTEND_URL
        value: https://medi-canopy.netlify.app
